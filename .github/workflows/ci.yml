name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-full.txt ]; then
            pip install -r requirements-full.txt
          else
            pip install -r requirements.txt
          fi
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          python -m ruff check src/ tests/ scripts/

      - name: Run unit and leakage tests
        run: |
          python -m pytest -v tests/ --ignore=tests/test_pipeline_smoke.py

      - name: Run dev smoke integration test
        run: |
          python -m pytest -v tests/test_pipeline_smoke.py

