[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-twotower-ope"
version = "0.1.0"
description = "Two-Tower Retrieval + Re-Ranker with Counterfactual Off-Policy Evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ML Engineer & Researcher" }]
dependencies = [
    "torch>=2.2.0",
    "faiss-cpu>=1.8.0",
    "lightgbm>=4.3.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "omegaconf>=2.3.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
ope_extra = [
    "obp>=0.5.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
